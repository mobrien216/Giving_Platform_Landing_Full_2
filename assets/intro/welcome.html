<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cleveland Foundation — welcome</title>
<!-- Giving Portal animatic v5 (10-21-2026), adapted: shared font files, portrait layout, hand-off message -->
<!-- Fonts + brand tokens come from the shared stylesheet (already cached by the parent page) -->
<link rel="stylesheet" href="../css/tcf-v3.css">
<style>
:root{--green:#164430;--red:#CB1E4B;--orange:#EE7331;--mid:#086C43;--blue:#1A8DA9;--pink:#C0629A;--aqua:#19B9A9;--gray1:#F3F2F0;--gray2:#E8EAE5;--white:#FFFFFF;
  --head:'Paralucent','Aptos',system-ui,sans-serif;--body:'Source Sans Pro','Aptos',system-ui,sans-serif;--camp:'Paralucent Condensed','Paralucent',sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--green);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;background:var(--green);overflow:hidden;transform-origin:50% 50%}
.f{position:absolute;inset:0;opacity:0}
.play .f{animation:fIn .45s var(--ease) var(--tin) both,fOut .4s ease var(--tout) forwards}
.f1{--tin:.08s;--tout:1.40s;background:var(--green)}
.ground{position:absolute;inset:0;background:var(--white);opacity:0}
.play .ground{animation:fIn .45s var(--ease) 1.48s both}
.f2{--tin:1.52s;--tout:2.85s}.f3{--tin:2.92s;--tout:7s}
@keyframes fIn{from{opacity:0}to{opacity:1}}@keyframes fOut{to{opacity:0}}
.kick{position:absolute;display:flex;align-items:center;gap:14px;font:700 24px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gray2);opacity:0}
.kick::before{content:'';width:14px;height:14px;background:var(--orange)}
.kick.c{left:0;right:0;justify-content:center}
.kick.g{color:var(--mid)}
.play .kick{animation:up .45s ease calc(var(--tin) + .08s) both}
.line{position:absolute;font:700 104px/1.05 var(--head);letter-spacing:-.015em;color:var(--white)}
.line.c{left:0;right:0;text-align:center}
.line.g{color:var(--green)}
.w{display:inline-block;opacity:0;transform:translateY(.45em)}
.play .w{animation:wIn .48s cubic-bezier(.2,.9,.3,1) calc(var(--tin) + var(--wd)) both}
@keyframes wIn{to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* the single line: color bar, fixed order and proportions */
.bar{position:absolute;height:8px;display:flex;transform:scaleX(0);transform-origin:0 50%}
.bar i{display:block;height:100%}
.play .bar{animation:draw .55s var(--ease) var(--bd) both}@keyframes draw{to{transform:scaleX(1)}}
/* the geometric design: true circles and squares on a 10 x 12 grid, quiet field in Gray 1, cluster in brand colors */
.geo{position:absolute;left:0;top:0}
.geo .cell{position:absolute;width:var(--d);height:var(--d);border-radius:50%;background:var(--gray1);transform:scale(0)}
.geo .cell.sq{border-radius:0}
.play .geo .cell{animation:pop .4s cubic-bezier(.2,.9,.3,1.2) var(--cd) both}@keyframes pop{to{transform:none}}
/* right column, beside the pattern */
.col{position:absolute;left:1000px;width:800px}
.stats{display:flex;gap:90px;margin-top:40px;opacity:0}
.play .stats{animation:up .45s ease 1.98s both}
.stat .v{font:800 92px/1 var(--head);color:var(--green);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .k{font:700 18px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-top:12px}
.camp{position:absolute;left:1000px;top:270px;font:900 176px/.92 var(--camp);letter-spacing:0;text-transform:uppercase;color:var(--green)}
.camp .w{transform:translateY(.25em)}
/* end card: Gray 2, primary logo, the line, the name */
.f4{position:absolute;inset:0;background:var(--gray2);clip-path:circle(0px at 50% 50%)}
.play .f4{animation:reveal .5s cubic-bezier(.6,0,.25,1) 4.05s both}@keyframes reveal{to{clip-path:circle(1150px at 50% 50%)}}
.logo{position:absolute;left:580px;top:330px;width:760px;height:244px;background:url(../img/tcf-logo@2x.png) center/contain no-repeat;clip-path:inset(0 100% 0 0)}
.play .logo{animation:wipe .75s cubic-bezier(.55,0,.25,1) 4.3s both,settle .75s var(--ease) 4.3s both}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}@keyframes settle{from{transform:scale(1.03)}to{transform:none}}
.f4 .bar{left:580px;top:628px;width:760px}
.sub{position:absolute;left:0;right:0;top:672px;text-align:center;font:700 28px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mid);opacity:0}
.play .sub{animation:track .35s var(--ease) 5.05s both}@keyframes track{from{opacity:0;letter-spacing:.4em}to{opacity:1;letter-spacing:.12em}}


/* ---- site integration ---- */
#stage{background:transparent!important}
.play .ground{animation:fIn .45s var(--ease) 1.48s both,gOut .01s linear 4.6s forwards}
@keyframes gOut{to{opacity:0}}
html,body{animation:ground 6.2s linear both}
@keyframes ground{0%,24%{background:#164430}31%,64%{background:#FFFFFF}70%,100%{background:#E8EAE5}}
/* ---- portrait layout for phones: same four scenes, stacked ---- */
.portrait#stage{width:1080px;height:1920px;margin:-960px 0 0 -540px}
.portrait .f1 .kick{top:780px!important}
.portrait .f1 .line{top:834px!important;font-size:80px}
.portrait .f1 .bar{left:160px!important;top:990px!important}
.portrait .geo{transform:translate(30px,40px)}
.portrait .f2 .col{left:120px;width:840px;top:1110px!important}
.portrait .f2 .line{font-size:84px}
.portrait .stats{gap:70px}
.portrait .camp{left:120px;top:1110px;font-size:160px}
.portrait .f4 .logo{left:160px;top:760px}
.portrait .f4 .bar{left:160px;top:1060px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head><body>

<script>
/* counters, fit-to-screen (landscape or portrait), and the hand-off back to the app */
function counts(t){document.querySelectorAll('.cu').forEach(function(el){
  var to=parseFloat(el.dataset.to),p=t<2.03?0:Math.min((t-2.03)/0.72,1),v=to*(1-Math.pow(1-p,3));
  var s=el.dataset.grp?Math.round(v).toLocaleString('en-US'):v.toFixed(parseInt(el.dataset.dec||'0',10));
  el.textContent=(el.dataset.pre||'')+s+(el.dataset.suf||'');});}
var stage=document.getElementById('stage');
function fit(){var tall=innerHeight>innerWidth*1.05;stage.classList.toggle('portrait',tall);
  var w=tall?1080:1920,h=tall?1920:1080;stage.style.transform='scale('+Math.min(innerWidth/w,innerHeight/h)+')';}
addEventListener('resize',fit);fit();
var t0=performance.now(),sent=false;
function done(){if(sent)return;sent=true;try{parent.postMessage({tcf:'intro-done'},location.origin)}catch(e){}}
function loop(){var t=(performance.now()-t0)/1000;counts(t);if(t>=6.0)done();if(!sent)requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(matchMedia('(prefers-reduced-motion:reduce)').matches)setTimeout(done,300);
</script>
